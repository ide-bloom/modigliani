name: Bug report
description: Something in Studio, the server or the Home Assistant integration does not work.
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Studio (capture / inference / CLI), Modigliani Server, Home Assistant integration, Profile library, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `modigliani --version` or `modigliani-server --version`
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs or `modigliani doctor` output
      description: Remove serial numbers, tokens, addresses and account data first. Never attach raw captures or unscrubbed profiles.
      render: text
